name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m mypy pipeline.py buckets.py traffic_features.py contest.py carrier_contest.py ensemble_contest.py duration_contest.py specialist_ensemble.py arrival_features.py arrival_specialist.py arrival_contest.py arrival_boost_contest.py nm_neighbor_features.py nm_following_features.py ordinary_ensemble.py neighbor_boost_contest.py following_boost_contest.py long_following_contest.py nm_clock_overlay.py clock_overlay_contest.py leaderboard.py
      - run: python -m mypy forecast_features.py forecast_model.py forecast_run.py forecast_delivery.py forecast_search.py forecast_finalize.py forecast_guard.py forecast_guard_finalize.py forecast_novel_guard.py forecast_novel_finalize.py forecast_finish.py taxiout.py forward_leaderboard.py leaderboard_monitor.py
